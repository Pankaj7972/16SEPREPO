trigger :
  branches:
    include:
      - main    

stages :
  - stage: initwalastage
    displayName : initkastage
    pool: MYAGENT
    jobs:
      - job: initjob
        displayName: 'myjob'
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'MYSERVICE'
              backendAzureRmStorageAccountName: 'tfstate098'
              backendAzureRmContainerName: 'tfstate098container'
              backendAzureRmKey: 'terraform.tfstate'
         

  - stage: validatetwalastage
    displayName : validatekastage
    pool: MYAGENT
    jobs:
      - job: validatejob
        displayName: 'validatejob'
        steps:
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'
